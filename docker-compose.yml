version: '3.9'

services:
  postgres:
    image: postgres:12.2-alpine
    container_name: nakama-postgres-2
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    ports:
      - "5433:5432"
    volumes:
      - data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nakama:
    build: .
    container_name: nakama-2
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
    ports:
      - "7449:7349"
      - "7450:7350"
      - "7451:7351"
    restart: unless-stopped

volumes:
  data2:
